<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetClues | AI-Powered Pet Health &amp; Life Management</title>
    <meta
      name="description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta
      name="keywords"
      content="pet health tracker, pet passport, pet reminders, pet vaccinations, pet records, pet care app, pet health management, AI pet care, dog health tracker, cat health tracker, exotic pet care"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2C3E35" />
    <link rel="canonical" href="https://petclues.com/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Favicons (raster assets generated from /logo-source.png via npm run generate:favicons) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetClues" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="PetClues | AI-Powered Pet Health &amp; Life Management" />
    <meta
      property="og:description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta property="og:url" content="https://petclues.com/" />
    <meta property="og:image" content="https://petclues.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://petclues.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PetClues - AI-powered pet health management" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@petclues" />
    <meta name="twitter:title" content="PetClues | AI-Powered Pet Health &amp; Life Management" />
    <meta
      name="twitter:description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta name="twitter:image" content="https://petclues.com/og-image.png" />
    <meta name="twitter:image:alt" content="PetClues - AI-powered pet health management" />

    <!-- Organization - crawlers without JS (Google Knowledge Graph) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://petclues.com/#organization",
        "name": "PetClues",
        "url": "https://petclues.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://petclues.com/logo.png",
          "width": 512,
          "height": 512
        },
        "image": "https://petclues.com/logo.png",
        "description": "AI-powered pet health and life management platform.",
        "sameAs": [
          "https://instagram.com/thepetclues",
          "https://facebook.com/profile.php?id=61590826104670"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@petclues.com",
          "availableLanguage": "English"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://petclues.com/#website",
        "url": "https://petclues.com",
        "name": "PetClues",
        "description": "AI-powered pet health and life management platform.",
        "publisher": { "@id": "https://petclues.com/#organization" },
        "inLanguage": "en-US",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://petclues.com/blog?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link
      rel="preload"
      href="/images/landing/landing-hero-640w.webp"
      as="image"
      type="image/webp"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/images/landing/landing-hero-1024w.webp"
      as="image"
      type="image/webp"
      media="(min-width: 641px) and (max-width: 1024px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/images/landing/landing-hero-1920w.webp"
      as="image"
      type="image/webp"
      media="(min-width: 1025px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
