<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetClues | AI-Powered Pet Health &amp; Life Management</title>
    <meta
      name="description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta
      name="keywords"
      content="pet health tracker, pet passport, pet reminders, pet vaccinations, pet records, pet care app, pet health management, AI pet care, dog health tracker, cat health tracker, exotic pet care"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2C3E35" />
    <link rel="canonical" href="https://petclues.com/" />

    <!-- Favicons - static files in /public (required for Google Search site icon) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetClues" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="PetClues | AI-Powered Pet Health &amp; Life Management" />
    <meta
      property="og:description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta property="og:url" content="https://petclues.com/" />
    <meta property="og:image" content="https://petclues.com/logo.png" />
    <meta property="og:image:secure_url" content="https://petclues.com/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="PetClues logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@petclues" />
    <meta name="twitter:title" content="PetClues | AI-Powered Pet Health &amp; Life Management" />
    <meta
      name="twitter:description"
      content="Track health records, reminders, vaccinations, life stories, monthly reports, pet passports, and AI-powered pet insights in one place."
    />
    <meta name="twitter:image" content="https://petclues.com/logo.png" />
    <meta name="twitter:image:alt" content="PetClues logo" />

    <!-- Organization - crawlers without JS (Google Knowledge Graph) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://petclues.com/#organization",
        "name": "PetClues",
        "url": "https://petclues.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://petclues.com/logo.png",
          "width": 512,
          "height": 512
        },
        "image": "https://petclues.com/logo.png",
        "description": "AI-powered pet health and life management platform.",
        "sameAs": [
          "https://instagram.com/thepetclues",
          "https://facebook.com/profile.php?id=61590826104670"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@petclues.com",
          "availableLanguage": "English"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
